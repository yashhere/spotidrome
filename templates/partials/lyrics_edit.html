<div class="modal-backdrop" id="lyrics-editor-modal">
  <div
    class="modal-underlay"
    onclick="document.getElementById('lyrics-editor-modal').remove()"
    style="
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: -1;
    "
  ></div>
  <div class="modal-content">
    <div class="modal-header">
      <h3>Edit Track</h3>
      <button
        class="btn-close"
        onclick="document.getElementById('lyrics-editor-modal').remove()"
      >
        ×
      </button>
    </div>
    <!-- Toast notification (fixed position) -->
    <div class="toast-container" id="edit-toast" style="display: none"></div>

    <div class="modal-body">
      <!-- Header: Art + Title/Artist -->
      <div class="track-header">
        <div class="art-preview" id="art-preview">
          {% if has_art %}
          <img
            src="/api/tracks/art?file_path={{ file_path | urlencode }}"
            alt="Album Art"
            id="art-image"
          />
          {% else %}
          <div class="art-placeholder">No Art</div>
          {% endif %}
          <label class="art-overlay">
            <span>📷</span>
            <input
              type="file"
              accept="image/*"
              id="art-upload"
              style="display: none"
              onchange="uploadAlbumArt(this)"
            />
          </label>
        </div>
        <div class="track-info">
          <p class="track-filename">{{ filename }}</p>
          <div style="margin-top: 0.75rem; display: flex; gap: 0.5rem; flex-direction: column;">
            <input type="text" id="art-url-input" placeholder="Paste image URL here..." class="form-control"
              style="font-size: 0.85rem;" />
            <div style="display: flex; gap: 0.5rem;">
              <button type="button" class="btn-secondary" style="flex: 1; font-size: 0.85rem; padding: 0.4rem 0.75rem;"
                onclick="uploadFromUrl()">
                📎 Load from URL
              </button>
              <button type="button" class="btn-secondary" style="flex: 1; font-size: 0.85rem; padding: 0.4rem 0.75rem;"
                onclick="pasteFromClipboard()">
                📋 Paste from Clipboard
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Unified Form -->
      <form
        hx-post="/api/tracks/update"
        hx-swap="none"
        hx-on:htmx:after-request="handleFormResponse(event)"
        class="metadata-form"
      >
        <input type="hidden" name="file_path" value="{{ file_path }}" />

        <div class="form-row">
          <div class="form-group">
            <label>Title</label>
            <input
              type="text"
              name="title"
              value="{{ metadata.title }}"
              class="form-control"
            />
          </div>
          <div class="form-group">
            <label>Artist</label>
            <input
              type="text"
              name="artist"
              value="{{ metadata.artist }}"
              class="form-control"
            />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Album</label>
            <input
              type="text"
              name="album"
              value="{{ metadata.album }}"
              class="form-control"
            />
          </div>
          <div class="form-group" style="flex: 0 0 80px">
            <label>Year</label>
            <input
              type="text"
              name="date"
              value="{{ metadata.date }}"
              class="form-control"
            />
          </div>
          <div class="form-group" style="flex: 0 0 70px">
            <label>Track</label>
            <input
              type="text"
              name="track_number"
              value="{{ metadata.track_number }}"
              class="form-control"
            />
          </div>
        </div>

        <hr
          style="
            margin: 1.5rem 0;
            border: 0;
            border-top: 1px solid var(--border);
          "
        />

        <div
          style="
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
          "
        >
          <h4
            style="font-size: 0.9rem; color: var(--text-secondary); margin: 0"
          >
            Lyrics
          </h4>
          <label class="upload-link">
            <span>↑ Upload .lrc</span>
            <input
              type="file"
              accept=".lrc,.txt"
              id="lrc-upload"
              style="display: none"
              onchange="loadLrcFile(this)"
            />
          </label>
        </div>

        <div class="form-group">
          <textarea
            name="lyrics"
            id="lyrics-textarea"
            rows="12"
            class="lyrics-input"
            placeholder="Paste lyrics here (LRC format supported)..."
          >
{{ lyrics }}</textarea
          >
        </div>

        <div class="modal-footer">
          <button
            type="button"
            class="btn-secondary"
            onclick="document.getElementById('lyrics-editor-modal').remove()"
          >
            Cancel
          </button>
          <button type="submit" class="btn-primary">Save Changes</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
  function loadLrcFile(input) {
    const file = input.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function (e) {
      document.getElementById("lyrics-textarea").value = e.target.result;
      showToast("Loaded: " + file.name, "success");
    };
    reader.onerror = function () {
      showToast("Failed to read file", "error");
    };
    reader.readAsText(file);
  }

  function showToast(message, type = "success") {
    const toast = document.getElementById("edit-toast");
    toast.textContent = message;
    toast.className = "toast-container toast-" + type;
    toast.style.display = "block";

    // Auto-hide after 3 seconds
    setTimeout(() => {
      toast.style.display = "none";
    }, 3000);
  }

  function handleFormResponse(event) {
    if (event.detail.successful) {
      showToast("Track updated successfully!", "success");
      // Close modal after a brief delay to show the toast
      setTimeout(() => {
        document.getElementById("lyrics-editor-modal").remove();
      }, 1000);
    } else {
      showToast("Failed to update track", "error");
    }
  }

  async function uploadAlbumArt(input) {
    const file = input.files[0];
    if (!file) return;

    const formData = new FormData();
    formData.append("file_path", "{{ file_path }}");
    formData.append("art", file);

    try {
      const response = await fetch("/api/tracks/art", {
        method: "POST",
        body: formData,
      });

      if (response.ok) {
        showToast("Album art updated!", "success");
                updateArtPreview();
              } else {
                showToast("Failed to update album art", "error");
              }
            } catch (e) {
              showToast("Failed to upload", "error");
            }
          }

          async function uploadFromUrl() {
            const urlInput = document.getElementById("art-url-input");
            const url = urlInput.value.trim();

            if (!url) {
              showToast("Please enter an image URL", "error");
              return;
            }

            try {
              showToast("Downloading image...", "success");

              const formData = new FormData();
              formData.append("file_path", "{{ file_path }}");
              formData.append("art_url", url);

              const response = await fetch("/api/tracks/art", {
                method: "POST",
                body: formData,
              });

              if (response.ok) {
                showToast("Album art updated from URL!", "success");
                urlInput.value = "";
                updateArtPreview();
              } else {
                const error = await response.json();
                showToast(error.detail || "Failed to load image from URL", "error");
              }
            } catch (e) {
              showToast("Failed to download image", "error");
            }
          }

          async function pasteFromClipboard() {
            try {
              const clipboardItems = await navigator.clipboard.read();

              for (const item of clipboardItems) {
                const imageTypes = item.types.filter(type => type.startsWith('image/'));

                if (imageTypes.length === 0) {
                  showToast("No image found in clipboard", "error");
                  return;
                }

                const blob = await item.getType(imageTypes[0]);

                showToast("Uploading image from clipboard...", "success");

                const formData = new FormData();
                formData.append("file_path", "{{ file_path }}");
                formData.append("art", blob, "clipboard.png");

                const response = await fetch("/api/tracks/art", {
                  method: "POST",
                  body: formData,
                });

                if (response.ok) {
                  showToast("Album art updated from clipboard!", "success");
                  updateArtPreview();
                } else {
                  showToast("Failed to update album art", "error");
                }
                return;
              }
            } catch (e) {
              showToast("Failed to read clipboard. Make sure you've copied an image.", "error");
            }
          }

          function updateArtPreview() {
            const preview = document.getElementById("art-preview");
            const img = document.getElementById("art-image");
    const timestamp = Date.now();

    if (img) {
      img.src = "/api/tracks/art?file_path={{ file_path | urlencode }}&t=" + timestamp;
    } else {
      preview.innerHTML =
        '<img src="/api/tracks/art?file_path={{ file_path | urlencode }}&t=' +
        timestamp +
        '" alt="Album Art" id="art-image">' +
        '<label class="art-overlay"><span>📷</span><input type="file" accept="image/*" id="art-upload" style="display: none" onchange="uploadAlbumArt(this)"/></label>';
    }
  }
</script>
